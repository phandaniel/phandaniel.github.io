<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>macOS - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of macOS release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        
    <header>
      <h1>macOS</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>Latest Version</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../../data/macos.json',
        processData: (data) => {
          // Remove the first header row in data
          if (data.length > 0 && data[0].Release === "Version") data.shift();
          data.reverse();
          return data;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const version = getVal(['release']);
          const releaseDate = getVal(['latest release']);
          const comp = getVal(['compatibility']);
          
          let statusClass = 'status-supported';
          let statusText = 'Supported';
          let latestVersion = comp;
          
          if (comp.toLowerCase().includes('unsupported')) {
             statusClass = 'status-unsupported';
             statusText = 'Unsupported';
             latestVersion = comp.replace(/unsupported:?\s*/i, '');
          } else if (comp.toLowerCase().includes('preview')) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
             latestVersion = comp.replace(/preview version:?\s*/i, '');
          } else {
             latestVersion = comp.replace(/(supported|latest version):?\s*/i, '');
          }

          if (version === '—' || version.length > 50) return;

          return `
            <td class="version">${window.utils.cleanStr(version)}</td>
            <td>${window.utils.cleanStr(releaseDate)}</td>
            <td>${window.utils.cleanStr(latestVersion)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          }
      });
    });
  </script>
  
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=6"></script>
</body>
</html>
