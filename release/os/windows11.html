<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows 11 - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of Windows 11 release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        
    <header>
      <h1>Windows 11</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Name</th>
            <th>Build</th>
            <th>Release Date</th>
            <th>End of Support</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../../data/windows11.json',
        processData: (data) => {
          // Remove the header/garbage rows
          let filtered = data.filter(d => d.Name && d.Name.includes('Windows 11'));
          filtered.reverse();
          return filtered;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const rawVersion = getVal(['version']);
          const name = getVal(['name']);
          const build = getVal(['build']);
          const releaseDate = getVal(['release date']);
          const endSupport = getVal(['end of support by edition', 'end of support']);
          
          let statusClass = 'status-supported';
          let statusText = 'Supported';
          let version = rawVersion;
          
          if (rawVersion.toLowerCase().includes('unsupported')) {
             statusClass = 'status-unsupported';
             statusText = 'Unsupported';
             version = rawVersion.replace(/unsupported:?\s*/i, '');
          } else if (rawVersion.toLowerCase().includes('preview')) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
             version = rawVersion.replace(/preview version:?\s*/i, '');
          } else {
             version = rawVersion.replace(/(supported|latest version):?\s*/i, '');
          }

          return `
            <td class="version">${window.utils.cleanStr(version)}</td>
            <td>${window.utils.cleanStr(name)}</td>
            <td>${window.utils.cleanStr(build)}</td>
            <td>${window.utils.cleanStr(releaseDate)}</td>
            <td>${window.utils.cleanStr(endSupport)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          }
      });
    });
  </script>
  
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=6"></script>
</body>
</html>
