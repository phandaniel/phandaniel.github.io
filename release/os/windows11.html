<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.utils.renderPage({
        title: `Windows 11`,
        description: `A beautiful overview of Windows 11 release history.`,
        accent: '#ffffff',
        columns: ['Version', 'Name', 'Build', 'Release Date', 'Status'],
        url: '../../data/windows11.json',
        processData: (data) => {
          // Remove the header/garbage rows
          let filtered = data.filter(d => d.Name && d.Name.includes('Windows 11'));
          filtered.reverse();
          return filtered;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const rawVersion = getVal(['version']);
          const name = getVal(['name']);
          const build = getVal(['build']);
          const releaseDate = getVal(['release date']);
          
          let statusClass = 'status-supported';
          let statusText = 'Supported';
          let version = rawVersion;
          
          if (rawVersion.toLowerCase().includes('unsupported')) {
             statusClass = 'status-unsupported';
             statusText = 'Unsupported';
             version = rawVersion.replace(/unsupported:?\s*/i, '');
          } else if (rawVersion.toLowerCase().includes('preview')) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
             version = rawVersion.replace(/preview version:?\s*/i, '');
          } else {
             version = rawVersion.replace(/(supported|latest version):?\s*/i, '');
          }

          return `
            <td class="version">${window.utils.cleanStr(version)}</td>
            <td>${window.utils.cleanStr(name)}</td>
            <td>${window.utils.cleanStr(build)}</td>
            <td>${window.utils.cleanStr(releaseDate)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          }
      });
    });
  </script>
</head>
<body></body>
</html>
