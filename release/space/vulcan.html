<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vulcan - Phantom Telemetry</title>
  <meta name="description" content="A tracking page for ULA Vulcan launches.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        

    <header>
      <h1>Vulcan</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Flight</th>
            <th>Date</th>
            <th>Outcome</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../../data/vulcan.json',
        processData: (data) => {
          // Filter to keep only numbered flights and exactly one upcoming unnumbered flight
        let foundUpcoming = false;
        const filteredData = data.filter(release => {
          const date = window.utils.getVal(['date / time (utc)', 'date and time (utc)', 'date and time'], release);
          const flight = window.utils.getVal(['flight no.', 'flightno'], release);
          
          if (!date || date === '—' || date.length > 80) return false;
          
          if (!flight || flight === '—') {
            if (!foundUpcoming) {
              foundUpcoming = true;
              return true;
            }
            return false;
          }
          return true;
        });

        // Data is chronological. Reverse so newest/upcoming are on top.
        filteredData.reverse();
          return filteredData;
        },
        renderRow: (release) => {
          const keys = Object.keys(release);
          const getVal = (keys) => window.utils.getVal(keys, release);

          let flight = getVal(['flight no.', 'flightno']);
          let date = getVal(['date / time (utc)', 'date and time (utc)', 'date and time']).replace(/\s?\d{2}:\d{2}.*/, '');
          let outcome = getVal(['launchoutcome', 'launch outcome']);

          let statusText = 'Upcoming';
          let statusClass = 'status-preview';
          
          const oLower = outcome.toLowerCase();

          if (oLower.includes('success')) {
            statusText = 'Success';
            statusClass = 'status-supported';
          } else if (oLower.includes('failure') || oLower.includes('destroyed')) {
            statusText = 'Failure';
            statusClass = 'status-unsupported';
          } else if (oLower.includes('partial')) {
            statusText = 'Partial';
            statusClass = 'status-partial';
          }

          // Strip wikipedia citations
          const cleanStr = window.utils.cleanStr;

          flight = cleanStr(flight);
          date = cleanStr(date);

          return `
            <td class="flight-no">${flight !== '—' ? '#' + flight : '—'}</td>
            <td>${date}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          }
      });
    });
</script>

  
<script>window.basePath = "../../";</script>
  <script src="../../assets/js/app.js?v=6"></script>
</body>
</html>
