<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script src="../../assets/js/renderSpace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      window.spaceConfig = {
        dateKeys: ['date / time (utc)', 'date and time (utc)', 'date and time', 'date andtime'],
        flightKeys: ['flight no.', 'flightno', 'flight'],
        outcomeKeys: ['launchoutcome', 'launch outcome'],
        dateRegex: /\s?\d{2}:\d{2}.*/
      };

      window.utils.renderPage({
        title: `Starship`,
        description: `A tracking page for SpaceX Starship launches.`,
        accent: '#ffffff',
        columns: ['Flight', 'Date', 'Outcome'],
        url: '../../data/starship.json',
        processData: window.renderSpace.processData,
        renderRow: window.renderSpace.renderRow
      });
    });
  </script>
</head>
<body></body>
</html>
