<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.utils.renderPage({
        title: `RHEL`,
        description: `A beautiful overview of Red Hat Enterprise Linux release history.`,
        accent: '#ffffff',
        columns: ['Version', 'Release Date', 'Last Minor Release', 'End of Extended Lifecycle Support', 'Status'],
        url: '../../data/rhel.json',
        processData: (data) => {
          // Reverse the array to show the newest versions at the top
        data.reverse();
          return data;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const version = getVal(['rhelversion', 'version']);
          const releaseDate = getVal(['release date', 'released']);
          const minor = getVal(['last minorrelease', 'last minor release']);
          const fullSupport = getVal(['end of full support']);
          const els = getVal(['end of extendedlifecycle support', 'end of extended lifecycle support', 'end of extended lifecycle support (els)']);
          let eol = els;
          if (!eol || eol.includes('N/a') || eol === '—') {
            eol = fullSupport;
          }
          
          let statusClass = 'status-unsupported';
          let statusText = 'Unsupported';
          
          const eolLower = eol.toLowerCase();
          if (eolLower.includes('tba') || eolLower.includes('future') || new Date(eol) > new Date()) {
             statusClass = 'status-supported';
             statusText = 'Supported';
          }
          if (releaseDate.toLowerCase().includes('future') || new Date(releaseDate) > new Date()) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
          }

          // Don't render completely empty rows that might have been scraped
          if (version === '—' || version.length > 50) return;

          // Clean up values
          const cleanVal = window.utils.cleanVal; (val) => val ? val.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').trim() : '';

          let cleanVersion = cleanVal(version).replace(/\s*\(.*?\)\s*/g, '');
          let cleanDate = releaseDate;
          if (cleanDate.includes('(AS)')) {
            cleanDate = cleanDate.split('(AS)')[0].trim();
          }
          let cleanMinor = cleanVal(minor);
          let cleanFullSupport = cleanVal(fullSupport);
          let cleanELS = cleanVal(els).replace(/—N\/a|N\/a/i, 'N/A').replace('—', 'N/A');
          
          if (cleanMinor.toLowerCase().includes('n/a') || cleanMinor === '—') cleanMinor = window.utils.emDash();
          if (cleanFullSupport.toLowerCase().includes('n/a') || cleanFullSupport === '—') cleanFullSupport = window.utils.emDash();
          if (cleanELS.toLowerCase().includes('n/a') || cleanELS === '—') cleanELS = window.utils.emDash();

          return `
            <td class="version">RHEL ${cleanVersion}</td>
            <td>${cleanDate}</td>
            <td>${cleanMinor}</td>
            <td>${cleanELS}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          }
      });
    });
  </script>
</head>
<body></body>
</html>
