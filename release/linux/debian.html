<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debian - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of Debian Linux release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        
    <header>
      <h1>Debian</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Codename</th>
            <th>Release Date</th>
            <th>Paid ELTS</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../../data/debian.json',
        processData: (data) => {
          // Filter out subheader rows that got scraped
          let filtered = data.filter(d => !d['Ver.'] || (d['Ver.'] !== 'Binary' && !d['Ver.'].includes('Development')));
          filtered.reverse();
          return filtered;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const rawVersion = getVal(['ver.', 'version']);
          const rawCodename = getVal(['code']);
          const releaseDate = getVal(['release date']);
          const endSupport = getVal(['paid elts']);
          
          let statusClass = 'status-supported';
          let statusText = 'Supported';
          let version = rawVersion;
          
          if (rawVersion.toLowerCase().includes('unsupported')) {
             statusClass = 'status-unsupported';
             statusText = 'Unsupported';
             version = rawVersion.replace(/unsupported:?\s*/i, '');
          } else if (rawVersion.toLowerCase().includes('testing') || rawVersion.toLowerCase().includes('future version')) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
             version = rawVersion.replace(/(testing|future version):?\s*/i, '');
          } else {
             version = rawVersion.replace(/(supported|latest version|future version):?\s*/i, '');
          }

          if (version === '—' || version.length > 50) return;
          if (rawVersion.toLowerCase().includes('preview')) return;
          
          // Remove versions after 14
          const versionNumber = parseFloat(version);
          if (versionNumber > 14) return;

          let cleanCodename = window.utils.cleanStr(rawCodename)
            .replace(/(unsupported|supported|future version):?\s*/gi, '');

          return `
            <td class="version">Debian ${window.utils.cleanStr(version)}</td>
            <td>${cleanCodename}</td>
            <td>${window.utils.cleanStr(releaseDate)}</td>
            <td>${window.utils.cleanStr(endSupport)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          }
      });
    });
  </script>
  
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=6"></script>
</body>
</html>
