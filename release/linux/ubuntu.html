<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.utils.renderPage({
        title: `Ubuntu`,
        description: `A beautiful overview of Ubuntu Linux release history.`,
        accent: '#ffffff',
        columns: ['Version', 'Release Date', 'Standard Support', 'Legacy Add-On', 'Status'],
        url: '../../data/ubuntu.json',
        processData: (data) => {
          data.reverse();
          return data;
        },
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);

          const version = getVal(['version']);
          const releaseDate = getVal(['release date', 'released', 'release']);
          const standardSupport = getVal(['standard support']);
          const legacyAddOn = getVal(['legacy add-on']);
          
          let eol = '—';
          if (legacyAddOn && legacyAddOn !== '—' && !legacyAddOn.includes('N/a')) {
            eol = legacyAddOn;
          } else if (standardSupport && standardSupport !== '—' && !standardSupport.includes('N/a')) {
            eol = standardSupport;
          }
          
          let statusClass = 'status-unsupported';
          let statusText = 'Unsupported';
          
          const cleanVal = window.utils.cleanVal || ((val) => val ? val.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').trim() : '');
          const cleanEol = cleanVal(eol);
          const eolLower = eol.toLowerCase();
          
          if (eolLower.includes('tba') || eolLower.includes('future') || new Date(cleanEol) > new Date() || eolLower.trim().startsWith('supported:') || eolLower.includes('latest version')) {
             statusClass = 'status-supported';
             statusText = 'Supported';
          }
          if (releaseDate.toLowerCase().includes('future') || new Date(cleanVal(releaseDate)) > new Date() || eolLower.includes('preview version')) {
             statusClass = 'status-preview';
             statusText = 'Upcoming';
          }

          if (version === '—' || version.length > 50) return;

          let cleanVersion = cleanVal(version).replace(/\s*\(.*?\)\s*/g, '');
          let cleanStdSupport = cleanVal(standardSupport);
          let cleanLegacy = cleanVal(legacyAddOn);
          
          if (cleanLegacy.toLowerCase().includes('n/a') || cleanLegacy === '—') cleanLegacy = window.utils.emDash();

          return `
            <td class="version">Ubuntu ${cleanVersion}</td>
            <td>${releaseDate}</td>
            <td>${cleanStdSupport}</td>
            <td>${cleanLegacy}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          }
      });
    });
  </script>
</head>
<body></body>
</html>
