<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.utils.renderPage({
        title: `Python`,
        description: `A beautiful overview of Python release history.`,
        accent: '#ffffff',
        columns: ['Version', 'Latest Micro Version', 'Release Date', 'End of Security Fixes', 'Status'],
        url: '../../data/python.json',
        processData: (data) => data.reverse(),
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);
          
          let rawVersion = getVal(['version']);
          let microVersion = getVal(['latest micro version']);
          let date = getVal(['release date']);
          let support = getVal(['end of security fixes', 'end of full support']);
          
          if (rawVersion === '—' || rawVersion.length > 50) return;

          let version = rawVersion;
          let statusText = 'Supported';
          let statusClass = 'status-supported';
          
          if (rawVersion.toLowerCase().includes('unsupported')) {
              statusText = 'Unsupported';
              statusClass = 'status-unsupported';
              version = rawVersion.replace(/unsupported:?\s*/i, '');
          } else if (rawVersion.toLowerCase().includes('future version') || rawVersion.toLowerCase().includes('future release')) {
              statusText = 'Upcoming';
              statusClass = 'status-preview';
              version = rawVersion.replace(/future (version|release):?\s*/i, '');
          } else if (rawVersion.toLowerCase().includes('latest version')) {
              statusText = 'Supported';
              statusClass = 'status-supported';
              version = rawVersion.replace(/latest version:?\s*/i, '');
          } else {
              statusText = 'Supported';
              statusClass = 'status-supported';
              version = rawVersion.replace(/supported:?\s*/i, '');
          }

          const cleanStr = window.utils.cleanStr;

          return `
            <td class="version">${cleanStr(version)}</td>
            <td>${cleanStr(microVersion)}</td>
            <td>${cleanStr(date)}</td>
            <td>${cleanStr(support)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
        }
      });
    });
  </script>
</head>
<body></body>
</html>
