<head>

  <script src="../../assets/js/renderSports.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      window.sportsConfig = {
        opponentKey: ['opponent'],
        dateKey: ['date'],
        resultKey: ['result'],
        hasBye: true
      };

      window.utils.renderPage({
        title: `Washington Commanders`,
        description: `A tracking page for Washington Commanders football schedule.`,
        accent: '#ffffff',
        columns: ['Date', 'Opponent', 'Score', 'Result'],
        url: '../../data/commanders.json',
        processData: window.renderSports.processData,
        renderRow: window.renderSports.renderRow
      });
    });
  </script>
