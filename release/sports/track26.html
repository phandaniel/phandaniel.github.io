<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2026 US Track & Field - Phantom Telemetry</title>
  <meta name="description" content="2026 USA Outdoor Track and Field Championships">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
    <header>
      <h1>2026 US Track & Field</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Event</th>
            <th>Gold</th>
            <th>Gold Time</th>
            <th>Silver</th>
            <th>Silver Time</th>
            <th>Bronze</th>
            <th>Bronze Time</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../../data/track26.json',
        processData: (data) => data,
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);
          return `
            <td class="version">${window.utils.cleanStr(getVal(['category']))}</td>
            <td>${window.utils.cleanStr(getVal(['event']))}</td>
            <td style="color: #FFD700;">${window.utils.cleanStr(getVal(['gold']))}</td>
            <td>${window.utils.cleanStr(getVal(['gold time']))}</td>
            <td style="color: #C0C0C0;">${window.utils.cleanStr(getVal(['silver']))}</td>
            <td>${window.utils.cleanStr(getVal(['silver time']))}</td>
            <td style="color: #CD7F32;">${window.utils.cleanStr(getVal(['bronze']))}</td>
            <td>${window.utils.cleanStr(getVal(['bronze time']))}</td>
          `;
        }
      });
    });
  </script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=6"></script>
</body>
</html>
