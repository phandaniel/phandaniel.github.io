<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.basePath = "../../";</script>
  <script src="../../assets/js/categories.js"></script>
  <script src="../../assets/js/app.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.utils.renderPage({
        title: `UFC 329 Results`,
        description: `Results for UFC 329: Holloway vs McGregor`,
        accent: '#ef4444',
        columns: [],
        customHTML: `<div id="tables-wrapper" style="display: none;"></div>`,
        init: async () => {
          
try {
        const response = await fetch('../../data/ufc329.json');
        if (!response.ok) throw new Error('Failed to fetch data');
        const data = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        const wrapper = document.getElementById('tables-wrapper');
        wrapper.style.display = 'block';
        
        // Group by card
        const cards = {};
        for (const item of data) {
          if (!cards[item.Card]) cards[item.Card] = [];
          cards[item.Card].push(item);
        }
        
        for (const [cardName, items] of Object.entries(cards)) {
          const section = document.createElement('div');
          section.innerHTML = `
            <h2 style="margin-top: 2rem; margin-bottom: 1rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; display: inline-block;">${cardName}</h2>
            <div class="table-container" style="overflow-x: auto; margin-bottom: 2rem;">
              <table class="ufc-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                  <tr>
                    <th>Weight class</th>
                    <th>Winner</th>
                    <th>Loser</th>
                    <th>Method</th>
                    <th class="center-col">Round</th>
                    <th class="center-col">Time</th>
                  </tr>
                </thead>
                <tbody>
                  ${items.map(item => `
                    <tr>
                      <td>${window.utils.cleanStr(item['Weight class'])}</td>
                      <td><span class="status-badge status-supported">${window.utils.cleanStr(item['Winner'])}</span></td>
                      <td><span class="status-badge status-unsupported">${window.utils.cleanStr(item['Loser'])}</span></td>
                      <td>${window.utils.cleanStr(item['Method']).replace(/\s*\([\d\s,–-]+\)/g, '')}</td>
                      <td class="center-col">${window.utils.cleanStr(item['Round'])}</td>
                      <td class="center-col">${window.utils.cleanStr(item['Time'])}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
          wrapper.appendChild(section);
        }
      } catch (err) {
        document.getElementById('loading').textContent = 'Failed to load data: ' + err.message;
      }
        }
      });
    });
  </script>
</head>
<body></body>
</html>
