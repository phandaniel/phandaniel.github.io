<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RHEL - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of Red Hat Enterprise Linux release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        

    <header>
      <h1>RHEL</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>Last Minor Release</th>
            <th>End of Full Support</th>
            <th>End of Extended Lifecycle Support</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('../data/rhel.json');
        if (!response.ok) throw new Error("Could not fetch rhel.json");
        const data = await response.json();
        
        // Reverse the array to show the newest versions at the top
        data.reverse();

        const tbody = document.getElementById('table-body');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        data.forEach(release => {
          const keys = Object.keys(release);
          
          const getVal = (keys) => window.utils.getVal(keys, release);

          const version = getVal(['rhelversion', 'version']);
          const releaseDate = getVal(['release date', 'released']);
          const minor = getVal(['last minorrelease', 'last minor release']);
          const fullSupport = getVal(['end of full support']);
          const els = getVal(['end of extendedlifecycle support', 'end of extended lifecycle support', 'end of extended lifecycle support (els)']);
          const eol = fullSupport;
          
          // Determine status loosely based on EOL text
          let statusClass = 'status-eol';
          let statusText = 'End of Life';
          
          const eolLower = eol.toLowerCase();
          if (eolLower.includes('tba') || eolLower.includes('future') || new Date(eol) > new Date()) {
             statusClass = 'status-active';
             statusText = 'Supported';
          }
          if (releaseDate.toLowerCase().includes('future') || new Date(releaseDate) > new Date()) {
             statusClass = 'status-future';
             statusText = 'Upcoming';
          }

          // Don't render completely empty rows that might have been scraped
          if (version === '—' || version.length > 50) return;

          // Clean up values
          const cleanVal = (val) => val ? val.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').trim() : '';

          let cleanVersion = cleanVal(version).replace(/\s*\(.*?\)\s*/g, '');
          let cleanMinor = cleanVal(minor);
          let cleanFullSupport = cleanVal(fullSupport);
          let cleanELS = cleanVal(els).replace(/—N\/a|N\/a/i, 'N/A').replace('—', 'N/A');
          
          if (cleanMinor.toLowerCase().includes('n/a') || cleanMinor === '—') cleanMinor = '<span style="color: var(--text-muted); font-weight: 400;">&mdash;</span>';
          if (cleanFullSupport.toLowerCase().includes('n/a') || cleanFullSupport === '—') cleanFullSupport = '<span style="color: var(--text-muted); font-weight: 400;">&mdash;</span>';
          if (cleanELS.toLowerCase().includes('n/a') || cleanELS === '—') cleanELS = '<span style="color: var(--text-muted); font-weight: 400;">&mdash;</span>';

          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td class="version">RHEL ${cleanVersion}</td>
            <td>${releaseDate}</td>
            <td>${cleanMinor}</td>
            <td>${cleanFullSupport}</td>
            <td>${cleanELS}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>

  
<script>window.basePath = "../";</script>
  <script src="../assets/js/app.js?v=5"></script>
</body>
</html>
