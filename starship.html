<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starship Launches</title>
  <meta name="description" content="A tracking page for SpaceX Starship launches.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.7);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #f97316;
      --border: rgba(255, 255, 255, 0.05);
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.08), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08), transparent 40%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 60px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-menu {
      display: inline-flex;
      gap: 5px;
      margin-bottom: 40px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 20px;
      z-index: 100;
    }
    
    .nav-link {
      padding: 10px 28px;
      border-radius: 40px;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    
    .nav-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    
    .nav-link.active {
      background: var(--accent);
      color: #000000;
      font-weight: 600;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #f97316 0%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    .table-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .flight-no {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--text-muted);
      padding: 50px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-unsupported { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .status-supported { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .status-partial { background: rgba(250, 204, 21, 0.15); color: #facc15; }
    .status-preview { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-menu">
      <a href="index.html" class="nav-link">Fedora</a>
      <a href="ubuntu.html" class="nav-link">Ubuntu</a>
      <a href="linux.html" class="nav-link">Linux Kernel</a>
      <a href="ios.html" class="nav-link">iOS</a>
      <a href="starship.html" class="nav-link active">Starship</a>
    </nav>

    <header>
      <h1>Starship Launches</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Flight</th>
            <th>Date (UTC)</th>
            <th>Booster</th>
            <th>Ship</th>
            <th>Payload</th>
            <th>Outcome</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('starship.json');
        if (!response.ok) throw new Error("Could not fetch starship.json");
        const data = await response.json();
        
        // Data is roughly chronological from Wikipedia. Let's reverse it so newest/upcoming are on top.
        data.reverse();

        const tbody = document.getElementById('table-body');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        data.forEach(release => {
          const keys = Object.keys(release);
          
          const getVal = (searchStrs) => {
            for (let str of searchStrs) {
               const key = keys.find(k => k.toLowerCase().includes(str));
               if (key && release[key].trim()) return release[key];
            }
            return '—';
          };

          let flight = getVal(['flightno']);
          let date = getVal(['date and time', 'date andtime']);
          let booster = getVal(['version,booster']);
          let ship = getVal(['version,ship']);
          let payload = getVal(['payload']);
          let outcome = getVal(['launch outcome']);

          if (date === '—') return;

          let statusText = 'Upcoming';
          let statusClass = 'status-preview';
          
          const oLower = outcome.toLowerCase();

          if (oLower.includes('success')) {
            statusText = 'Success';
            statusClass = 'status-supported';
          } else if (oLower.includes('failure') || oLower.includes('destroyed')) {
            statusText = 'Failure';
            statusClass = 'status-unsupported';
          } else if (oLower.includes('partial')) {
            statusText = 'Partial';
            statusClass = 'status-partial';
          }

          // Strip wikipedia citations
          const cleanStr = (s) => s.replace(/\[\d+\]/g, '').replace(/—N\/a/gi, '&mdash;');

          flight = cleanStr(flight);
          date = cleanStr(date);
          booster = cleanStr(booster);
          ship = cleanStr(ship);
          payload = cleanStr(payload);

          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td class="flight-no">${flight !== '—' ? '#' + flight : '—'}</td>
            <td>${date}</td>
            <td>${booster}</td>
            <td>${ship}</td>
            <td>${payload}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>
</body>
</html>
