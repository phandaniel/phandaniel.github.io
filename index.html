<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fedora Release History</title>
  <meta name="description" content="A beautiful overview of Fedora Linux release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="--accent: #3b82f6;">
  <div class="container">
        

    <header>
      <h1>Fedora Release History</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>End of Life</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('data/fedora.json');
        if (!response.ok) throw new Error("Could not fetch fedora.json");
        const data = await response.json();
        
        // Reverse the array to show the newest versions at the top
        data.reverse();

        const tbody = document.getElementById('table-body');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        data.forEach(release => {
          const keys = Object.keys(release);
          
          const getVal = (keys) => window.utils.getVal(keys, release);

          const version = getVal(['version']);
          const releaseDate = getVal(['release']);
          const eol = getVal(['end-of-life', 'eol', 'end of life']);
          
          // Determine status loosely based on EOL text
          let statusClass = 'status-eol';
          let statusText = 'End of Life';
          
          const eolLower = eol.toLowerCase();
          if (eolLower.includes('tba') || eolLower.includes('future') || new Date(eol) > new Date()) {
             statusClass = 'status-active';
             statusText = 'Supported';
          }
          if (releaseDate.toLowerCase().includes('future') || new Date(releaseDate) > new Date()) {
             statusClass = 'status-future';
             statusText = 'Upcoming';
          }

          // Don't render completely empty rows that might have been scraped
          if (version === '—' || version.length > 50) return;

          // Clean up version string (e.g., "Unsupported: 1 (Yarrow)" -> "1")
          let cleanVersion = version.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').replace(/\s*\(.*?\)\s*/g, '').trim();

          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td class="version">Fedora ${cleanVersion}</td>
            <td>${releaseDate}</td>
            <td>${eol}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>

  
<script src="assets/js/app.js"></script>
</body>
</html>
