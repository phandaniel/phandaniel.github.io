<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phantom Telemetry</title>
  <meta name="description" content="A tracking hub for technology and aerospace versions.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <style>
    .hero {
      text-align: center;
      padding: 3rem 1rem 1rem;
      margin-bottom: 2rem;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.5rem;
      align-items: start;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 0;
    }
    .card {
      background: rgba(24, 24, 27, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 48px;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: rgba(255, 255, 255, 0.2);
      transition: width 0.2s ease;
      opacity: 0.8;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(39, 39, 42, 0.6);
    }
    .card:hover::before {
      width: 100%;
      opacity: 0.03;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 500;
      margin: 0;
      color: var(--text-main);
      z-index: 1;
    }
    .category-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin: 0 0 1rem 0;
      font-weight: 600;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

  <div class="container" style="max-width: 1400px;">

    </header>

      <div>

          <a href="ai/chatgpt.html" class="card">
            <h2>ChatGPT</h2>
          </a>
          <a href="ai/claude.html" class="card">
            <h2>Claude</h2>
          </a>
          <a href="ai/gemini.html" class="card">
            <h2>Gemini</h2>
          </a>
          <a href="ai/grok.html" class="card">

        </div>
      </div>

      <div>
        <div class="category-title">Aerospace</div>
        <div class="grid">

          </a>
        </div>

      <div>
        <div class="category-title">Developer Tools</div>
        <div class="grid">
          <a href="dev/kubernetes.html" class="card">
            <h2>Kubernetes</h2>
          </a>
        </div>
      </div>

      <div>

  </div>

</body>
</html>
