<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Android - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of Android release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=2">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        
    <header>
      <h1>Android</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Version</th>
            <th>API Level</th>
            <th>Release Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        fetch('../data/android.json')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('table-body');
          
          // Filter to only include rows from the main summary table
          const mainTableData = data.filter(r => r['name'] || r['Name']);
          
          mainTableData.reverse().forEach(release => {
            const getVal = (keys) => window.utils.getVal(keys, release);
            
            let name = getVal(['name']);
            let rawVersion = getVal(['version number(s)', 'version']);
            let api = getVal(['api level']);
            let date = getVal(['release date', 'initial release date']);
            
            if (rawVersion === '—' || rawVersion.length > 50) return;

            let version = rawVersion;
            let statusText = 'Supported';
            let statusClass = 'status-supported';
            
            if (rawVersion.toLowerCase().includes('unsupported')) {
                statusText = 'Unsupported';
                statusClass = 'status-unsupported';
                version = rawVersion.replace(/unsupported:?\s*/i, '');
            } else if (rawVersion.toLowerCase().includes('future release')) {
                statusText = 'Upcoming';
                statusClass = 'status-preview';
                version = rawVersion.replace(/future release:?\s*/i, '');
            } else if (rawVersion.toLowerCase().includes('latest version')) {
                statusText = 'Latest';
                statusClass = 'status-supported';
                version = rawVersion.replace(/latest version:?\s*/i, '');
            } else {
                statusText = 'Supported';
                statusClass = 'status-supported';
                version = rawVersion.replace(/(supported):?\s*/i, '');
            }

            const cleanStr = (s) => (s || '—').trim();
            // sometimes name comes with brackets e.g. Android 1.0[14]
            let cleanName = cleanStr(name).replace(/\\[\\d+\\]/g, '');
            let cleanVersion = cleanStr(version).replace(/\\[\\d+\\]/g, '');

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="version">${cleanName}</td>
              <td>${cleanVersion}</td>
              <td>${cleanStr(api)}</td>
              <td>${cleanStr(date)}</td>
              <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
          console.error('Error loading android data:', err);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>

  <script>window.basePath = "../";</script>
  <script src="../assets/js/app.js?v=2"></script>
</body>
</html>
