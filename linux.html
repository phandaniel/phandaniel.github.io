<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linux Kernel History</title>
  <meta name="description" content="A beautiful overview of Linux Kernel version history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #facc15; /* Yellow for Tux beak */
      --border: rgba(255, 255, 255, 0.1);
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(250, 204, 21, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.1), transparent 25%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 60px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

        .dropdown-menu {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
    }

    .dropdown-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .dropdown-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }

    .dropdown-content {
      position: absolute;
      top: 60px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      min-width: 200px;
      display: flex;
      flex-direction: column;
      padding: 8px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropdown-content.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .nav-link {
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      display: block;
      margin-bottom: 2px;
    }
    
    .nav-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      padding-left: 20px;
    }
    
    .nav-link.active {
      background: var(--accent);
      color: #000000;
      font-weight: 600;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(to right, #facc15, #fef08a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .table-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .version {
      font-weight: 700;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--text-muted);
      padding: 50px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-unsupported { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .status-supported { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .status-preview { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
        <div class="dropdown-menu">
      <button class="dropdown-btn" id="dropdownBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="dropdown-content" id="dropdownContent">
        <a href="index.html" class="nav-link">Fedora</a>
        <a href="ubuntu.html" class="nav-link">Ubuntu</a>
        <a href="linux.html" class="nav-link active">Linux Kernel</a>
        <a href="ios.html" class="nav-link">iOS</a>
        <a href="starship.html" class="nav-link">Starship</a>
      </div>
    </div>

    <header>
      <h1>Linux Kernel History</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>Last Release</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('linux.json');
        if (!response.ok) throw new Error("Could not fetch linux.json");
        const data = await response.json();
        
        // No reverse needed, Linux table is mostly newest-first already
        
        const tbody = document.getElementById('table-body');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        data.forEach(release => {
          const keys = Object.keys(release);
          
          const getVal = (searchStrs) => {
            for (let str of searchStrs) {
               const key = keys.find(k => k.toLowerCase().includes(str));
               if (key && release[key].trim()) return release[key];
            }
            return '—';
          };

          const version = getVal(['version']);
          const releaseDate = getVal(['original release date', 'release date', 'released', 'release']);
          let lastRelease = getVal(['last release']);
          
          if (version === '—' || version.length > 50) return;

          let statusText = 'Unsupported';
          let statusClass = 'status-unsupported';
          
          const vLower = version.toLowerCase();
          if (vLower.includes('preview version') || vLower.includes('future version')) {
            statusText = 'Upcoming';
            statusClass = 'status-preview';
          } else if ((vLower.includes('supported') || vLower.includes('latest')) && !vLower.includes('unsupported')) {
            statusText = 'Supported';
            statusClass = 'status-supported';
          }

          let cleanVersion = version.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').replace(/\s*\(.*?\)\s*/g, '').trim();

          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td class="version">v${cleanVersion}</td>
            <td>${releaseDate}</td>
            <td>${lastRelease}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>

  <script>
    document.getElementById('dropdownBtn').addEventListener('click', function(e) {
      document.getElementById('dropdownContent').classList.toggle('show');
      e.stopPropagation();
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown-menu')) {
        let content = document.getElementById('dropdownContent');
        if(content && content.classList.contains('show')) {
          content.classList.remove('show');
        }
      }
    });
  </script>
</body>
</html>
