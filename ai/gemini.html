<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini - Phantom Telemetry</title>
  <meta name="description" content="A tracking page for Gemini versions.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
    <header>
      <h1>Gemini</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../data/gemini.json',
        processData: (data) => {
          data.reverse();
          return data;
        },
        renderRow: (release) => {
          const keys = Object.keys(release);
          const getVal = (searchStrs) => window.utils.getVal(searchStrs, release);

          let version = getVal(['version', 'model']);
          let date = getVal(['date']);
          let status = getVal(['status']);


          if (version === '—' || version.length > 50) return;

          let statusText = 'Discontinued';
          let statusClass = 'status-unsupported';
          
          const sLower = status.toLowerCase();
          if (sLower.includes('active') || sLower.includes('supported') || sLower.includes('current')) {
            statusText = 'Active';
            statusClass = 'status-supported';
          } else if (sLower.includes('upcoming') || sLower.includes('unreleased') || sLower.includes('preview') || sLower.includes('future')) {
            statusText = 'Preview';
            statusClass = 'status-preview';
          } else if (status !== '—') {
            let cleanStatus = status.split('[')[0];
            if (cleanStatus.toLowerCase().includes('latest')) {
              statusText = 'Latest';
              statusClass = 'status-supported';
            } else {
              statusText = cleanStatus.trim();
              statusClass = 'status-partial';
            }
          }

          const cleanStr = window.utils.cleanStr;

          return `
            <td class="version">${cleanStr(version)}</td>
            <td>${cleanStr(date)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          }
      });
    });
</script>
  <script>window.basePath = "../";</script>
  <script src="../assets/js/app.js?v=6"></script>
</body>
</html>
