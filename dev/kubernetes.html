<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kubernetes - PhanDaniel Dashboards</title>
  <meta name="description" content="A beautiful overview of Kubernetes release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=2">
</head>
<body style="--accent: #3b82f6;">
  <div class="container">
        

    <header>
      <h1>Kubernetes</h1>
      <p>Release history and support lifecycles for Kubernetes.</p>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>End of Life</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        fetch('../data/kubernetes.json')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('table-body');
          data.reverse().forEach(release => {
            const getVal = (keys) => window.utils.getVal(keys, release);
            
            let rawVersion = getVal(['version']);
            let date = getVal(['release date', 'date']);
            let eol = getVal(['end of life', 'end of life date', 'end of life date[92]']);
            
            if (rawVersion === '—' || rawVersion.length > 50) return;

            let version = rawVersion;
            let statusText = 'Active';
            let statusClass = 'status-supported';
            
            if (rawVersion.toLowerCase().includes('unsupported')) {
                statusText = 'EOL';
                statusClass = 'status-unsupported';
                version = rawVersion.replace(/unsupported:?\s*/i, '');
            } else if (rawVersion.toLowerCase().includes('latest version')) {
                statusText = 'Latest';
                statusClass = 'status-supported';
                version = rawVersion.replace(/latest version:?\s*/i, '');
            } else if (rawVersion.toLowerCase().includes('supported')) {
                statusText = 'Supported';
                statusClass = 'status-supported';
                version = rawVersion.replace(/supported:?\s*/i, '');
            } else if (rawVersion.toLowerCase().includes('future') || rawVersion.toLowerCase().includes('preview')) {
                statusText = 'Upcoming';
                statusClass = 'status-preview';
                version = rawVersion.replace(/future release:?\s*/i, '').replace(/preview:?\s*/i, '');
            }

            const cleanStr = (s) => (s || '—').trim();

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="version">${cleanStr(version)}</td>
              <td>${cleanStr(date)}</td>
              <td>${cleanStr(eol)}</td>
              <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
          console.error('Error loading kubernetes data:', err);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>

  
<script>window.basePath = "../";</script>
  <script src="../assets/js/app.js?v=2"></script>
</body>
</html>
