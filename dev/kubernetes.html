<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kubernetes - Phantom Telemetry</title>
  <meta name="description" content="A beautiful overview of Kubernetes release history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
</head>
<body style="--accent: #ffffff;">
  <div class="container">
        

    <header>
      <h1>Kubernetes</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Release Date</th>
            <th>End of Life</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.basePath = "../";
    window.addEventListener('DOMContentLoaded', () => {
      window.utils.renderTable({
        url: '../data/kubernetes.json',
        processData: (data) => data.reverse(),
        renderRow: (release) => {
          const getVal = (keys) => window.utils.getVal(keys, release);
          
          let rawVersion = getVal(['version']);
          let date = getVal(['release date', 'date']);
          let eol = getVal(['end of life', 'end of life date', 'end of life date[92]']);
          
          if (rawVersion === '—' || rawVersion.length > 50) return;

          let version = rawVersion;
          let statusText = 'Active';
          let statusClass = 'status-supported';
          
          if (rawVersion.toLowerCase().includes('unsupported')) {
              statusText = 'Unsupported';
              statusClass = 'status-unsupported';
              version = rawVersion.replace(/unsupported:?\s*/i, '');
          } else {
              statusText = 'Supported';
              statusClass = 'status-supported';
              version = rawVersion.replace(/(latest version|supported|future release|preview):?\s*/i, '');
          }

          const cleanStr = (s) => (s || '—').trim();

          return `
            <td class="version">${cleanStr(version)}</td>
            <td>${cleanStr(date)}</td>
            <td>${cleanStr(eol)}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
        }
      });
    });
  </script>
  <script src="../assets/js/app.js?v=6"></script>
</body>
</html>
