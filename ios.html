<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iOS Version History</title>
  <meta name="description" content="A beautiful overview of iOS version history.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.7);
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --accent: #0071e3;
      --border: rgba(255, 255, 255, 0.1);
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 113, 227, 0.15), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.05), transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 60px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-menu {
      display: inline-flex;
      gap: 5px;
      margin-bottom: 40px;
      background: rgba(28, 28, 30, 0.85);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 20px;
      z-index: 100;
    }
    
    .nav-link {
      padding: 10px 28px;
      border-radius: 40px;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    
    .nav-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .nav-link.active {
      background: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1.5px;
    }

    .table-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .version {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.15rem;
    }

    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--text-muted);
      padding: 50px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-unsupported { background: rgba(255, 69, 58, 0.15); color: #ff453a; }
    .status-supported { background: rgba(48, 209, 88, 0.15); color: #30d158; }
    .status-preview { background: rgba(10, 132, 255, 0.15); color: #0a84ff; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-menu">
      <a href="index.html" class="nav-link">Fedora</a>
      <a href="ubuntu.html" class="nav-link">Ubuntu</a>
      <a href="linux.html" class="nav-link">Linux Kernel</a>
      <a href="ios.html" class="nav-link active">iOS</a>
    </nav>

    <header>
      <h1>iOS Version History</h1>
    </header>

    <div id="loading" class="loading">Loading timeline data...</div>
    
    <div class="table-container" id="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Initial Release</th>
            <th>Latest Version</th>
            <th>Latest Release Date</th>
            <th>Device EOL</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('ios.json');
        if (!response.ok) throw new Error("Could not fetch ios.json");
        const data = await response.json();
        
        data.reverse(); // Newest first

        const tbody = document.getElementById('table-body');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        
        loading.style.display = 'none';
        tableContainer.style.display = 'block';

        data.forEach(release => {
          const keys = Object.keys(release);
          
          const getVal = (searchStrs) => {
            for (let str of searchStrs) {
               const key = keys.find(k => k.toLowerCase().includes(str));
               if (key && release[key].trim()) return release[key];
            }
            return '—';
          };

          const version = getVal(['version']);
          let initialRelease = getVal(['initial release']);
          let latestVersion = getVal(['latest version']);
          let latestReleaseDate = getVal(['latest release date']);
          let eol = getVal(['end-of-life', 'eol', 'device']);

          if (version === '—' || version.length > 50) return;

          let statusText = 'Unsupported';
          let statusClass = 'status-unsupported';
          
          const vLower = version.toLowerCase();
          const eolLower = eol.toLowerCase();

          if (vLower.includes('preview version') || vLower.includes('future version') || vLower.includes('beta')) {
            statusText = 'Upcoming';
            statusClass = 'status-preview';
          } else if ((vLower.includes('supported') || vLower.includes('latest')) && !vLower.includes('unsupported')) {
            statusText = 'Supported';
            statusClass = 'status-supported';
          } else if (eolLower.includes('present') || eolLower.includes('current') || eolLower.includes('supported')) {
             statusText = 'Supported';
             statusClass = 'status-supported';
          }

          let cleanVersion = version.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').replace(/\s*\(.*?\)\s*/g, '').trim();

          latestVersion = latestVersion.replace(/^(Unsupported|Supported|Latest version|Preview version|Future version):\s*/i, '').trim();

          // Remove citation links like [1][2]
          eol = eol.replace(/\\[\\d+\\]/g, '');

          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td class="version">iOS ${cleanVersion}</td>
            <td>${initialRelease}</td>
            <td>${latestVersion}</td>
            <td>${latestReleaseDate}</td>
            <td>${eol}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('loading').innerText = 'Data not generated yet. The GitHub Action will create data soon!';
        console.error(err);
      }
    }

    loadData();
  </script>
</body>
</html>
